const FSOT = {

// --- MARKET PRICES ---
// BBER Montana Sawlog Price Report, Q3 2026 (Jul-Sep), statewide survey of mills, $/MBF Scribner delivered.
// BBER now publishes an average LOW and average HIGH per species, not a single average. The UI shows the
// published range; the model uses the range midpoint and carries the range width as price uncertainty.
// Ponderosa pine uses the "yellow" row. Prior basis: BBER Q1 2025 single averages (DF $464).
const PRICE_SOURCE = "BBER Q3 2026";
const SPECIES = [
  {id:"df",  label:"Douglas-fir",    low:424, high:473},
  {id:"lp",  label:"Lodgepole Pine", low:398, high:453},
  {id:"wl",  label:"Western Larch",  low:424, high:473},
  {id:"pp",  label:"Ponderosa Pine", low:320, high:333},
  {id:"wrc", label:"W. Red Cedar",   low:467, high:600},
];
function speciesById(id){ return SPECIES.find(function(s){return s.id===id;}) || SPECIES[0]; }
function priceMid(sp){ return (sp.low + sp.high) / 2; }
function rangeText(sp){ return '$' + sp.low + '-' + sp.high; }

// --- HAUL COST CURVE ---
// BBER 2022 trucking costs (FSOT v2.3 sec. 6): $12.51/ton at 30 mi, $58.40/ton at 250 mi, linear between the
// two published points. 8 tons/MBF per FSOT v2.3 sec. 3. Distances are straight-line: no road circuity
// factor is applied because none is sourced in the project docs, so long winding routes are understated.
const HAUL = { m1:30, c1:12.51, m2:250, c2:58.40, tonsPerMbf:8 };
const HAUL_SLOPE = (HAUL.c2 - HAUL.c1) / (HAUL.m2 - HAUL.m1);
function haulPerMbf(mi){ return (HAUL.c1 + HAUL_SLOPE * (mi - HAUL.m1)) * HAUL.tonsPerMbf; }
// Miles at which the curve reproduces the mill's stored typical haul cost.
function refMiles(mill){ return HAUL.m1 + (mill.cost.haul / HAUL.tonsPerMbf - HAUL.c1) / HAUL_SLOPE; }

// Diesel sensitivity: $/MBF per $/gal at the mill's typical haul (app assumption, unsourced), scaled by distance.
const DIESEL_BASE = 3.10, DIESEL_PER_GAL = 4.0;

// --- PROFIT RING BANDS (shared by MAP and COMPETITION) ---
// 0-50 mi profitable, 50-100 marginal, 100-125 unprofitable, beyond 125 outside the basket. Season scales radii.
const BANDS = [{mi:25,cls:"profitable"},{mi:50,cls:"profitable"},{mi:75,cls:"marginal"},{mi:100,cls:"marginal"},{mi:125,cls:"unprofitable"}];
function classify(mi, rs){
  if (mi <= 50*rs) return "profitable";
  if (mi <= 100*rs) return "marginal";
  if (mi <= 125*rs) return "unprofitable";
  return null;
}
function zoneOf(mi, rs){
  var c = classify(mi, rs);
  return c==="profitable" ? "PROFITABLE" : c==="marginal" ? "MARGINAL" : "UNECONOMIC";
}
function zoneColor(z){ return z==="PROFITABLE" ? T.green : z==="MARGINAL" ? T.yellow : T.red; }

function haversineMi(lat1, lon1, lat2, lon2){
  var R = 3958.7613, toR = Math.PI/180;
  var dLat = (lat2-lat1)*toR, dLon = (lon2-lon1)*toR;
  var h = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*toR)*Math.cos(lat2*toR)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return 2*R*Math.asin(Math.sqrt(h));
}

// --- MOISTURE ---
// Price per green ton at the assumed MC, restated to the actual MC. Basis: 100K tons/yr bought by weight.
const MOISTURE_TONS = 100000;
function moistureGap(mill, mcPct){
  var flat = mill.moisture.flat, a = mill.moisture.assumed/100, m = mcPct/100;
  var adj = flat * (1-m) / (1-a);
  var over = flat - adj;
  return {flat:flat, adj:adj, over:over, annual: over * MOISTURE_TONS};
}

// --- BID MODEL ---
// Confidence = P(delivered cost <= (1 - target margin) x market price), normal approximation.
// Cost spread: the mill's P10-P90 cost band ($/ton, illustrative) converted at 8 tons/MBF.
// Price spread: BBER low-high range treated as uniform (sd = width / sqrt 12).
const Z65 = 0.3853204664, Z90 = 1.2815515655;
function phi(z){
  var t = 1/(1+0.2316419*Math.abs(z));
  var d = 0.3989422804014327*Math.exp(-z*z/2);
  var p = d*t*(0.319381530+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));
  return z > 0 ? 1-p : p;
}
function countyMiles(mill, county){ return haversineMi(mill.lat, mill.lon, county.lat, county.lon); }
function evaluate(mill, county, season, species, s){
  var ref = refMiles(mill);
  var mi = county ? countyMiles(mill, county) : ref;
  var haulBase = haulPerMbf(mi);
  var haul = haulBase * season.mult;
  var diesel = (s.diesel - DIESEL_BASE) * DIESEL_PER_GAL * (mi / ref);
  var delivered = s.stumpage + mill.cost.logging + haul + diesel;
  var mid = priceMid(species);
  var keep = 1 - s.marginPct/100;
  var sigmaC = HAUL.tonsPerMbf * (mill.mc.p90 - mill.mc.p10) / (2*Z90);
  var sigmaP = (species.high - species.low) / Math.sqrt(12);
  var sigma = Math.sqrt(sigmaC*sigmaC + keep*keep*sigmaP*sigmaP);
  var target = keep * mid;
  var conf = phi((target - delivered) / sigma);
  var rec = conf >= 0.65 ? "BID" : conf >= 0.5 ? "CAUTIOUS" : "PASS";
  var ceiling = target - mill.cost.logging - haul - diesel - Z65*sigma;
  return {
    miles:mi, refMiles:ref, haul:haul, haulBase:haulBase, diesel:diesel, delivered:delivered,
    mid:mid, margin: mid - delivered, marginPct: (mid - delivered)/mid,
    target:target, conf:conf, rec:rec, ceiling:ceiling, sigmaC:sigmaC, sigma:sigma,
    p10: delivered - Z90*sigmaC, p90: delivered + Z90*sigmaC,
  };
}
function recColor(rec){ return rec==="BID" ? T.teal : rec==="CAUTIOUS" ? T.yellow : T.red; }
function usd(v){ return (v<0?'-$':'$') + Math.round(Math.abs(v)).toLocaleString(); }
function signedUsd(v){ return (v>=0?'+$':'-$') + Math.round(Math.abs(v)).toLocaleString(); }

// --- WHAT-IF SLIDERS ---
function WhatIfSliders({sliders, setSliders, defaults}) {
  function set(k){ return function(v){ setSliders(function(prev){ var n = Object.assign({}, prev); n[k] = v; return n; }); }; }
  function Slider(props) {
    var delta = Math.round((props.value - props.dflt)*100)/100;
    var hasDelta = Math.abs(delta) > 0.001;
    return e('div',{style:{marginBottom:10}},
      e('div',{style:{display:'flex',justifyContent:'space-between',fontSize:10,marginBottom:3}},
        e('span',{style:{color:T.muted,letterSpacing:'0.1em'}},props.label),
        e('span',{style:{display:'flex',alignItems:'center',gap:4}},
          e('span',{style:{color:T.accent,fontWeight:700,fontSize:11}},props.fmt(props.value)),
          hasDelta && e('span',{style:{fontSize:9,fontWeight:700,color:delta>0?T.red:T.teal,padding:'1px 4px',background:(delta>0?T.red:T.teal)+'15'}},props.deltaFmt(delta))
        )
      ),
      e('input',{type:'range','aria-label':props.label,min:props.min,max:props.max,step:props.step,value:props.value,onChange:function(ev){props.onChange(parseFloat(ev.target.value));},style:{width:'100%'}}),
      e('div',{style:{display:'flex',justifyContent:'space-between',fontSize:9,color:T.muted,marginTop:1}},
        e('span',null,props.fmt(props.min)),e('span',null,props.fmt(props.max))
      )
    );
  }
  var isDefault = ['diesel','stumpage','mc','marginPct'].every(function(k){return sliders[k]===defaults[k];});
  function sgn(d){ return (d>0?'+':'') ; }
  return e('div',{style:{padding:'8px 0',borderTop:'1px solid '+T.rule}},
    e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}},
      e('div',{style:{fontSize:10,color:T.accent,letterSpacing:'0.15em',fontWeight:600}},'WHAT-IF CONTROLS'),
      !isDefault && e('button',{onClick:function(){setSliders(Object.assign({}, defaults));},style:{
        background:'transparent',border:'1px solid '+T.rule,padding:'3px 8px',
        fontSize:9,color:T.text2,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',gap:3,letterSpacing:'0.1em'
      }},e(IconRefresh,{size:9,color:T.text2}),' RESET')

    Slider({label:'DIESEL',value:sliders.diesel,min:2.50,max:5.50,step:0.10,dflt:defaults.diesel,fmt:function(v){return '$'+v.toFixed(2)+'/gal';},deltaFmt:function(d){return sgn(d)+d.toFixed(2);},onChange:set('diesel')}),
    Slider({label:'STUMPAGE ASK',value:sliders.stumpage,min:100,max:400,step:5,dflt:defaults.stumpage,fmt:function(v){return '$'+v+'/MBF';},deltaFmt:function(d){return sgn(d)+d;},onChange:set('stumpage')}),
    Slider({label:'ACTUAL MC',value:sliders.mc,min:35,max:65,step:1,dflt:defaults.mc,fmt:function(v){return v+'%';},deltaFmt:function(d){return sgn(d)+d+'%';},onChange:set('mc')}),
    Slider({label:'TARGET MARGIN',value:sliders.marginPct,min:0,max:25,step:1,dflt:defaults.marginPct,fmt:function(v){return v+'%';},deltaFmt:function(d){return sgn(d)+d+'%';},onChange:set('marginPct')})
  );

// Contested: in two or more visible mills' baskets (profitable or marginal) with at least one profitable.
function saleStatus(sale, mills, rs){
  var per = mills.map(function(m){ var mi = haversineMi(m.lat, m.lon, sale.lat, sale.lon); return {mill:m, mi:mi, cls:classify(mi, rs)}; });
  var prof = per.filter(function(p){return p.cls==="profitable";});
  var inBasket = per.filter(function(p){return p.cls==="profitable"||p.cls==="marginal";});
  var status = prof.length>=1 && inBasket.length>=2 ? "contested" : prof.length===1 ? "exclusive" : inBasket.length>=1 ? "marginal" : "unreachable";
  return {per:per, status:status, owner: prof.length===1 ? prof[0].mill : null};
}

function CompetitionView({season}) {
  var containerRef = useRef(null);
  var stateRef = useRef(null);
  var _loading = useState(true); var mapLoading=_loading[0]; var setMapLoading=_loading[1];
  var _v = useState({"MT-003":true,"MT-007":true,"MT-005":true});
  var visible=_v[0]; var setVisible=_v[1];
  var _s = useState(true);  var showSales=_s[0];      var setShowSales=_s[1];
  var _c = useState(false); var contestedOnly=_c[0];  var setContestedOnly=_c[1];
  var rs = season ? season.ringScale : 1.0;
  var visMills = COMPETITION_MILLS.filter(function(m){return visible[m.id];});
  var statuses = useMemo(function(){
    var o = {}; COMPETITION_SALES.forEach(function(s){ o[s.id] = saleStatus(s, visMills, rs); }); return o;
  }, [visible, rs]);

  useEffect(function(){
    if(!containerRef.current || stateRef.current) return;
    if(typeof L === "undefined") return;
    var map = L.map(containerRef.current, {zoomControl:true, attributionControl:true});
    var tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution:'&copy; OpenStreetMap contributors &copy; CARTO', subdomains:'abcd', maxZoom:19
    }).addTo(map);
    tileLayer.on('load', function(){ setMapLoading(false); });
    var fallback = setTimeout(function(){ setMapLoading(false); }, 3000);
    map.fitBounds([[45.6,-116.2],[49.0,-112.0]]);
    // Keep tiles filling the container whenever the layout changes size (fonts, rotation, header changes).
    var ro = typeof ResizeObserver !== "undefined" ? new ResizeObserver(function(){ map.invalidateSize(); }) : null;
    if (ro) ro.observe(containerRef.current);
    stateRef.current = {map:map, layers:[]};
    setTimeout(function(){ if(stateRef.current) stateRef.current.map.invalidateSize(); }, 120);
    return function(){ clearTimeout(fallback); if (ro) ro.disconnect(); if(stateRef.current){ stateRef.current.map.remove(); stateRef.current=null; } };
  }, []);

  useEffect(function(){
    if(!stateRef.current) return;
    var s = stateRef.current;
    s.layers.forEach(function(l){ s.map.removeLayer(l); });
    s.layers = [];
    visMills.forEach(function(m){
      BANDS.forEach(function(b){
        var fo = b.cls==="profitable" ? 0.10 : b.cls==="marginal" ? 0.05 : 0;
        var c = L.circle([m.lat,m.lon], {
          radius: b.mi*1609.344*rs, color:m.color, weight:1, opacity:0.6,
          dashArray: b.cls==="unprofitable" ? '4,4' : null, fillColor:m.color, fillOpacity:fo, interactive:false
        }).addTo(s.map);
        s.layers.push(c);
      });
      var mm = L.circleMarker([m.lat,m.lon], {
        radius:8, color:T.bg, weight:2, fillColor:m.color, fillOpacity:1
      }).bindPopup('<div class="kx-pop-title">'+m.name+'</div><div class="kx-pop-sub">'+m.city+', MT</div>').addTo(s.map);
      s.layers.push(mm);
    });
    if(showSales){
      COMPETITION_SALES.forEach(function(sale){
        var st = statuses[sale.id];
        if(contestedOnly && st.status!=="contested") return;
        var fill = T.muted, r = 5;
        if(st.status==="contested"){ fill = T.red; r = 8; }
        else if(st.status==="exclusive"){ fill = st.owner.color; r = 6; }
        else if(st.status==="marginal"){ fill = T.yellow; r = 6; }
        var popup = '<div class="kx-pop-title">'+sale.name+'</div>'
          + '<div class="kx-pop-sub">'+sale.volume_mbf.toLocaleString()+' MBF '+sale.species+' &middot; '+sale.agency+'</div>'
          + '<div style="margin:4px 0">Status: <b style="color:'+fill+'">'+st.status.toUpperCase()+'</b></div>';
        st.per.forEach(function(p){
          popup += '<div class="kx-pop-row"><span>'+p.mill.name+'</span><span>'+(p.cls?p.cls:'outside rings')+' &middot; '+Math.round(p.mi)+' mi</span></div>';
        });
        var sm = L.circleMarker([sale.lat,sale.lon], {
          radius:r, color:T.bg, weight:2, fillColor:fill, fillOpacity:0.95
        }).bindPopup(popup).addTo(s.map);
        s.layers.push(sm);
      });
    }
  }, [visible, showSales, contestedOnly, rs, statuses]);

  function toggle(id){ var n=Object.assign({},visible); n[id]=!n[id]; setVisible(n); }

  var contestedCount = COMPETITION_SALES.filter(function(s){return statuses[s.id].status==="contested";}).length;

    e('div',{style:{padding:'10px 16px 8px',borderBottom:'1px solid '+T.rule,flexShrink:0}},
      e('div',{style:{fontSize:10,color:T.accent,letterSpacing:'0.15em',fontWeight:600,marginBottom:8}},'COMPETITION OVERLAP - WESTERN MT'),
      e('div',{style:{display:'flex',gap:4,marginBottom:6}},
        COMPETITION_MILLS.map(function(m){
          var on = visible[m.id];
          return e('button',{key:m.id, onClick:function(){toggle(m.id);}, 'aria-pressed':on, style:{
            background: on?m.color:T.surface, color: on?T.bg:T.muted,
            border:'1px solid '+(on?m.color:T.rule),
            padding:'7px 2px', fontSize:9, fontWeight:700, letterSpacing:'0.02em',
            cursor:'pointer', flex:'1 1 auto', minWidth:0, textTransform:'uppercase', whiteSpace:'nowrap'
          }}, m.name);
        })
      ),
      e('div',{style:{display:'flex',gap:4}},
        e('button',{onClick:function(){setShowSales(!showSales);}, 'aria-pressed':showSales, style:{
          background: showSales?T.text2:T.surface, color: showSales?T.bg:T.muted,
          border:'1px solid '+(showSales?T.text2:T.rule),
          padding:'6px 8px', fontSize:9, fontWeight:700, letterSpacing:'0.1em',
          cursor:'pointer', flex:1
        }}, showSales?'SALES: ON':'SALES: OFF'),
        e('button',{onClick:function(){setContestedOnly(!contestedOnly);}, 'aria-pressed':contestedOnly, style:{
          background: contestedOnly?T.red:T.surface, color: contestedOnly?T.bg:T.muted,
          border:'1px solid '+(contestedOnly?T.red:T.rule),
          padding:'6px 8px', fontSize:9, fontWeight:700, letterSpacing:'0.1em',
          cursor:'pointer', flex:1
        }}, contestedOnly?'CONTESTED ONLY':'ALL SALES')
      )
    ),
    e('div',{style:{flex:1, minHeight:320, position:'relative'}},
      e('div',{ref:containerRef, style:{width:'100%',height:'100%', background:T.surface}}),
      mapLoading && e('div',{style:{position:'absolute',top:0,left:0,right:0,bottom:0,background:'rgba(10,12,11,0.85)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,pointerEvents:'none'}},
        e('div',{style:{fontSize:10,color:T.muted,letterSpacing:'0.15em'}},'LOADING MAP...')

        seasonBadge(season))

    e('div',{style:{padding:'8px 16px',borderTop:'1px solid '+T.rule,fontSize:9,color:T.muted,display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0,gap:8}},

             {v:'43 hrs/wk',l:'lost to manual admin',s:'Miller et al. 2024'},
             {v:'>30%',l:'of logging owners expect to exit in 5 yrs',s:'Conrad et al. 2022'},
             {v:'+25%',l:'federal timber offered target',s:'EO 14225; USDA 2025'},
            ].map(function(s,i){return e('div',{key:i,style:{padding:'8px 0',paddingLeft:i%2===1?10:0,paddingRight:i%2===0?8:0,borderBottom:'1px solid '+T.rule,borderRight:i%2===0?'1px solid '+T.rule:'none'}},
              e('div',{style:{fontSize:16,fontWeight:800,color:T.accent}},s.v),
              e('div',{style:{fontSize:9,color:T.text2}},s.l),
              e('div',{style:{fontSize:9,color:T.muted,marginTop:2}},s.s)
            );})
          )
        ),

        // Footer
        e('div',{style:{padding:'12px 16px',borderTop:'1px solid '+T.rule}},
          e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
            e('div',{style:{fontSize:10,color:T.muted,letterSpacing:'0.15em'}},'STRATHEX, INC.'),
            e('div',{style:{fontSize:9,color:T.accent,fontWeight:600}},'Explored: '+Object.keys(viewedMills).length+' of '+MILLS.length+' mills')
          ),
          e('div',{style:{fontSize:10,color:T.text2,marginTop:4}},'Built in Montana, for Montana.'),
          e('div',{style:{fontSize:9,color:T.muted,marginTop:4,lineHeight:1.5}},'Sources: BBER Q3 2026 sawlog prices, BBER 2022 trucking costs, USDA FIA, MT DOR FY2023, IDL Apr 2025, US Census county boundaries')
        )
        ) // end kx-detail-col
      ),

      view==="cta" && e('div',{style:{padding:'0 20px'}},
        e(CTAScreen,{onBack:function(){setView("product");scrollTop();},mill:mill,mc:sliders.mc})
      ),

      view==="competition" && e('div',{style:{height:'100%'}},
        e(CompetitionView,{season:season})
      )
    ),

    // BOTTOM BAR
    view==="product" && e('div',{style:{position:'absolute',bottom:0,left:0,right:0,padding:'10px 16px 22px',background:T.bg,borderTop:'1px solid '+T.rule,display:'flex',justifyContent:'space-between',gap:8,zIndex:10}},
      e('select',{value:speciesId,'aria-label':'Species',onChange:function(ev){setSpeciesId(ev.target.value);},style:{fontSize:10,padding:'8px 22px 8px 8px',flex:'0 1 auto'}},
        SPECIES.map(function(s){return e('option',{key:s.id,value:s.id},s.label+' '+rangeText(s));})
      ),
      e('button',{onClick:function(){setView("cta");scrollTop();},style:{background:T.accent,border:'none',padding:'10px 16px',color:T.bg,fontSize:12,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',gap:6,flexShrink:0}},
        'Your numbers ',e(IconRight,{size:14,color:T.bg})
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function() {});
}
</script>
</body>
</html>
